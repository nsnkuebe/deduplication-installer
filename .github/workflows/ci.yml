name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest prototype/tests -q

  cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S core -B build
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  # Later: run the Python and C++ implementations on spec/test-vectors
  # and fail if their hashes or manifests differ.
  # cross-check:
  #   needs: [python, cpp]
  #   ...
